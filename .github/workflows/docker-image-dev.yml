name: Build and Push Docker Dev Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.MD'
      - 'docker-compose.yml'
      - '.github/**'
      - 'vercel.json'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'version.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek2api:dev
            ghcr.io/${{ github.repository_owner }}/deepseek2api:dev-${{ steps.vars.outputs.short_sha }}
          platforms: linux/amd64,linux/arm64
